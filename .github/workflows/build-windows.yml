name: Build Windows

on:
  push:
    branches: [main, master]
  workflow_dispatch:        # lets you press "Run workflow" manually

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        run: cmake -S . -B "${{ runner.temp }}/build" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build "${{ runner.temp }}/build" --config Release

      - name: Collect Qt DLLs, plugins and QML modules
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item "${{ runner.temp }}/build/Release/appWarehouseDashboard.exe" dist/
          windeployqt --qmldir . --release --compiler-runtime dist/appWarehouseDashboard.exe
          # the app carries its own QML module inside the exe; a stray copy on disk would shadow it
          Remove-Item -Recurse -Force dist/qml/WarehouseDashboard -ErrorAction SilentlyContinue

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: WarehouseDashboard-windows
          path: dist
